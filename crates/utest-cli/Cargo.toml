[package]
name = "utest-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "utest"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.50", features = ["derive"] }
utest-application = { path = "../utest-application" }
utest-parser = { path = "../utest-parser" }
utest-runtime = { path = "../utest-runtime" }
