[package]
name = "utest-cli"
version = "0.1.1"
edition = "2024"

[[bin]]
name = "utest"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
tempfile = "3.20"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
utest-application = { path = "../utest-application" }
utest-domain = { path = "../utest-domain" }
utest-http = { path = "../utest-http" }
utest-parser = { path = "../utest-parser" }
utest-reporter = { path = "../utest-reporter" }
utest-runtime = { path = "../utest-runtime" }
