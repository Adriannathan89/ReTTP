[package]
name = "utest-http"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
bytes = "1.10"
indexmap = "2.14"
mime = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
utest-domain = { path = "../utest-domain" }

[dev-dependencies]
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
