name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Required CI gates
    uses: ./.github/workflows/ci.yaml

  fuzz:
    name: Required fuzz gates
    needs: ci
    uses: ./.github/workflows/fuzz.yaml

  verify-version:
    name: Verify release version
    needs: fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.0
      - name: Require a matching workspace version
        id: release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          test "${tag}" = "v${version}"
          test -n "${version}"

          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"

          package_versions="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[].version' | sort -u)"
          test "${package_versions}" = "${version}"

          release_core="${version%%+*}"
          if [[ "${release_core}" == *-* ]]; then
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo build --release --locked --package utest-cli --target ${{ matrix.target }}
      - name: Smoke-test Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/utest"
          version="${GITHUB_REF_NAME#v}"
          test "$("${binary}" --version)" = "utest ${version}"
          "${binary}" --help >/dev/null
      - name: Smoke-test Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/utest.exe"
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $actualVersion = (& $binary --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualVersion -ne "utest $version") {
            throw "unexpected binary version: $actualVersion"
          }
          & $binary --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "binary help smoke test failed"
          }
      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/utest-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" utest
      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/utest.exe" -DestinationPath "dist/utest-${env:GITHUB_REF_NAME}-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: utest-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs:
      - build
      - verify-version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum utest-* > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          prerelease: ${{ needs.verify-version.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: dist/*
